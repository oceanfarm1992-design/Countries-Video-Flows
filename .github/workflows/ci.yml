name: ci

# Installs the exact pinned dependencies and runs the offline smoke tests. Dependabot
# PRs are auto-merged only after this passes -- an unchecked auto-merge once broke
# `pip install` for every video workflow (styletts2 vs a bumped soundfile).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "config/**.json"
      - "requirements.txt"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: |
          pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Smoke tests
        run: python -m pytest tests -q

  auto-merge:
    needs: verify
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3

      # Patch/minor only; major bumps stay open for manual review.
      - name: Auto-merge patch / minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        # Dependabot opens several PRs at once; when two pass together, the second
        # merge fails with "Base branch was modified" and nothing retries it.
        run: |
          for i in 1 2 3 4; do
            gh pr merge --squash "$PR_URL" && exit 0
            sleep $((i * 15))
          done
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
