name: daily-rotating-short

# Single-video-per-day pipeline. Fires at each candidate post hour; the gate step
# checks whether this hour matches today's deterministic profile (from
# daily_variation.py) and exits 0 early on any non-matching hour, so only ONE video
# is actually built and posted per day. The series (country / hook / trending),
# narration length, hashtag set, and post hour all rotate deterministically, day to
# day, to keep the account's footprint varied and avoid bot-signal patterns.
on:
  schedule:
    # Fires at every candidate post hour: 8, 10, 11, 13, 15, 17 UTC.
    # Only the hour that today's daily_variation.py profile picked will proceed.
    - cron: "0 8,10,11,13,15,17 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Skip the hour-gate check and run regardless of the current hour"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: build the full video but do NOT create a release or post anywhere"
        type: boolean
        default: true
      footage_source:
        description: "Force footage source (blank = auto: pexels -> pixabay -> animate)"
        type: choice
        options: ["", "pexels", "pixabay", "animate", "archive"]
        default: ""

permissions:
  contents: write   # commit logs/history_rotating.csv and create the release asset

jobs:
  build_and_post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---- hour-gate: only proceed on the day's designated post hour ----
      - name: Check today's variation profile and gate on hour
        id: gate
        env:
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          # The whole decision happens in Python: a step cannot read its OWN
          # ${{ steps.*.outputs.* }} (those are interpolated before the step runs),
          # so the hour comparison must not be split across Python and shell.
          python - <<'EOF'
          import os, sys
          from datetime import datetime, timezone
          sys.path.insert(0, "scripts")
          from daily_variation import profile_for, day_number_for

          p = profile_for(day_number_for())
          current_hour = datetime.now(timezone.utc).hour
          force = os.environ.get("FORCE_RUN", "").lower() == "true"
          skip = not force and current_hour != p["hour"]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
              f.write(f"series={p['series']}\n")
              f.write(f"target_hour={p['hour']}\n")
              f.write(f"min_words={p['min_words']}\n")
              f.write(f"max_words={p['max_words']}\n")
              f.write(f"variant_seed={p['variant_seed']}\n")

          print(f"[gate] today's profile: series={p['series']}, "
                f"hour={p['hour']:02d}:00 UTC, words={p['min_words']}-{p['max_words']}")
          if skip:
              print(f"[gate] current hour {current_hour:02d} != target {p['hour']:02d} "
                    f"— skipping this run")
          else:
              print(f"[gate] proceeding (hour={current_hour:02d}, force_run={force})")
          EOF

      - name: Install system deps (ffmpeg, fonts, espeak fallback)
        if: steps.gate.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Install python deps
        if: steps.gate.outputs.skip == 'false'
        run: |
          pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # ---- content pipeline ----
      - name: Generate script (series selected by today's profile)
        if: steps.gate.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: |
          SERIES="${{ steps.gate.outputs.series }}"
          MIN_WORDS="${{ steps.gate.outputs.min_words }}"
          MAX_WORDS="${{ steps.gate.outputs.max_words }}"
          VARIANT_SEED="${{ steps.gate.outputs.variant_seed }}"
          COMMON_ARGS="--config config/countries.json --min-words $MIN_WORDS --max-words $MAX_WORDS --variant-seed $VARIANT_SEED"
          echo "[generate] series=$SERIES min_words=$MIN_WORDS max_words=$MAX_WORDS"
          if   [ "$SERIES" = "country" ];  then
            python scripts/generate_country_script.py $COMMON_ARGS
          elif [ "$SERIES" = "hook" ];     then
            python scripts/generate_hook_script.py $COMMON_ARGS
          elif [ "$SERIES" = "trending" ]; then
            python scripts/generate_trending_script.py $COMMON_ARGS
          else
            echo "[generate] unknown series '$SERIES' — defaulting to country"
            python scripts/generate_country_script.py $COMMON_ARGS
          fi

      - name: Fetch footage (Pexels / Pixabay / animation)
        if: steps.gate.outputs.skip == 'false'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          ARG=""
          if [ -n "${{ inputs.footage_source }}" ]; then
            ARG="--source ${{ inputs.footage_source }}"
          fi
          python scripts/fetch_footage.py --config config/countries.json $ARG

      - name: Generate TTS voiceover
        if: steps.gate.outputs.skip == 'false'
        env:
          VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
        run: python scripts/generate_tts.py --config config/countries.json

      - name: Generate captions
        if: steps.gate.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_captions.py --config config/countries.json

      - name: Generate background music (ambient pad)
        if: steps.gate.outputs.skip == 'false'
        run: python scripts/generate_music.py

      - name: Generate globe-zoom intro
        if: steps.gate.outputs.skip == 'false'
        continue-on-error: true
        run: |
          python -c "import json;d=json.load(open('build/script.json'));print(f\"--name={d['name']}\n--lat={d['lat']}\n--lon={d['lon']}\n--iso={d['iso2']}\")" > /tmp/introargs
          NAME=$(sed -n 's/^--name=//p' /tmp/introargs)
          LAT=$(sed -n 's/^--lat=//p' /tmp/introargs)
          LON=$(sed -n 's/^--lon=//p' /tmp/introargs)
          ISO=$(sed -n 's/^--iso=//p' /tmp/introargs)
          python scripts/generate_intro.py --name "$NAME" --lat "$LAT" --lon "$LON" \
            --iso "$ISO" --map assets/map/bluemarble.jpg --out build/intro.mp4 \
            --config config/countries.json

      - name: Assemble video
        if: steps.gate.outputs.skip == 'false'
        run: python scripts/assemble_video.py --config config/countries.json --intro build/intro.mp4

      # ---- publish ----
      - name: Publish video as release asset
        id: publish_asset
        if: steps.gate.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SERIES="${{ steps.gate.outputs.series }}"
          TAG="rotating-${SERIES}-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" build/final.mp4 \
            --title "$TAG" --notes "Automated rotating short (1/day, series=$SERIES)" --latest=false
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/final.mp4"
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Public video URL: $URL"

      - name: Post to Facebook + TikTok (Buffer)
        id: post_buffer
        if: steps.gate.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
        run: |
          python scripts/post_buffer.py \
            --video-url "${{ steps.publish_asset.outputs.video_url }}" \
            --script build/script.json \
            --caption-facebook build/caption_meta.txt \
            --caption-tiktok build/caption_tiktok.txt \
            --title-file build/yt_title.txt

      - name: Post to YouTube (Direct API)
        id: post_youtube
        if: steps.gate.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/post_youtube.py \
            --video build/final.mp4 \
            --title-file build/yt_title.txt \
            --desc-file build/caption_youtube.txt \
            --config config/countries.json

      # ---- dry run only: grab the assembled video + voice files for inspection ----
      - name: Upload dry-run artifacts
        if: always() && steps.gate.outputs.skip == 'false' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-rotating-output
          path: |
            build/final.mp4
            build/voice.wav
            build/intro_voice.wav
            build/script.json
          if-no-files-found: warn
          retention-days: 3

      # ---- log results ----
      - name: Append run to history log
        if: always() && steps.gate.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SERIES="${{ steps.gate.outputs.series }}"
          SCRIPT_TITLE=$(python -c "import json;d=json.load(open('build/script.json'));print(d.get('name',d.get('title','unknown')))" 2>/dev/null || echo "unknown")
          IDENT=$(python -c "import json;print(json.load(open('build/footage.json'))['identifier'])" 2>/dev/null || echo "unknown")
          echo "${DATE},${SERIES},\"${SCRIPT_TITLE}\",${IDENT},${{ steps.post_buffer.outcome }}" >> logs/history_rotating.csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/history_rotating.csv
          git commit -m "log: rotating run ${DATE} (${SERIES})" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase && git push && break || sleep $((i * 5))
          done
