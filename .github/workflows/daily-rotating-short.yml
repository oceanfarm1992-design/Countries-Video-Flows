name: daily-rotating-short

# One-video-per-day pipeline. Each day posts one of the six series (see
# daily_variation.py's SERIES_CYCLE) — over any 6-day window every series posts
# exactly once. (Reduced 2026-10-03 from 2/day to cut OpenAI/posting volume.)
# The "worst" day is a worst-of countdown (most polluted air, most corrupt, ...)
# built with the rankings pipeline (3D countdown, no country intro).
# The day's narration length, hashtag set, and target post hour rotate
# deterministically to keep the account's footprint varied.
#
# GitHub's scheduler starts cron runs late (often 1-2h) and silently drops many,
# so the gate does NOT require an exact hour match: on each hourly tick, if
# today's slot is due (now >= its target hour) and hasn't posted yet (no
# rotating-<series>-<today> release) it runs. Once it has posted, later runs
# that day skip.
on:
  schedule:
    # Hourly, all 24 hours, at :17 (off the top of the hour, where GitHub drops
    # the most runs). Extra ticks are catch-up retries for dropped runs; the
    # gate itself enforces target hours, a cross-series gap and a nightly blackout.
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Skip the hour-gate check and run regardless of the current hour"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: build the full video but do NOT create a release or post anywhere"
        type: boolean
        default: true
      footage_source:
        description: "Force footage source (blank = auto: pexels -> pixabay -> animate)"
        type: choice
        options: ["", "pexels", "pixabay", "animate", "archive"]
        default: ""
      series:
        description: "Force a series (applies with force_run; blank = today's profile)"
        type: choice
        options: ["", "country", "hook", "trending", "geography", "worlddata", "worst"]
        default: ""
      country_index:
        description: "Force a country index, 0-based into config/countries.json (blank = auto)"
        type: string
        default: ""

permissions:
  actions: read     # post_gate checks for other video workflows mid-build
  contents: write   # commit logs/history_rotating.csv and create the release asset

# Serialize runs so a catch-up run can't start building while an earlier one is still
# mid-build (before its release exists) and double-post.
concurrency:
  group: daily-rotating-short
  cancel-in-progress: false

jobs:
  build_and_post:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # GitHub's default is 6 hours; a stalled download once held a run 30+ min
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # ---- gate: run today's single slot if it's due and unposted ----
      - name: Check today's variation profile and gate
        id: gate
        env:
          FORCE_RUN: ${{ inputs.force_run }}
          SERIES_OVERRIDE: ${{ inputs.series }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The whole decision happens in Python: a step cannot read its OWN
          # ${{ steps.*.outputs.* }} (those are interpolated before the step runs).
          python - <<'EOF'
          import json, os, subprocess, sys
          from datetime import datetime, timezone
          sys.path.insert(0, "scripts")
          from daily_variation import profiles_for, day_number_for

          now = datetime.now(timezone.utc)
          slots = profiles_for(day_number_for(now.date()))
          force = os.environ.get("FORCE_RUN", "").lower() == "true"

          # Posting creates a release tagged rotating-<series>-YYYYMMDD-HHMMSS (UTC).
          # Fail closed: if the release list can't be read, don't risk a double post.
          today_tag = f"-{now:%Y%m%d}-"
          try:
              out = subprocess.run(
                  ["gh", "release", "list", "--limit", "100", "--json", "tagName"],
                  check=True, capture_output=True, text=True).stdout
              tags_today = [r["tagName"] for r in json.loads(out)
                            if r["tagName"].startswith("rotating-") and today_tag in r["tagName"]]
              read_ok = True
          except Exception as exc:
              print(f"[gate] could not read releases ({type(exc).__name__})")
              tags_today = []
              read_ok = False

          def already_posted(series):
              return any(t.startswith(f"rotating-{series}-") for t in tags_today)

          if force:
              # Manual override: run whichever of today's slots hasn't posted yet
              # (or slot A if the release list couldn't be read / both look posted).
              remaining = [s for s in slots if read_ok and not already_posted(s["series"])]
              pick, skip, reason = (remaining[0] if remaining else slots[0]), False, "force_run=true"
              if os.environ.get("SERIES_OVERRIDE"):
                  pick = dict(pick, series=os.environ["SERIES_OVERRIDE"])
          elif not read_ok:
              pick, skip, reason = None, True, "could not read releases — failing closed"
          else:
              due = [s for s in slots if now.hour >= s["hour"] and not already_posted(s["series"])]
              if due:
                  pick = min(due, key=lambda s: s["hour"])
                  skip, reason = False, f"slot {pick['slot']} due and not yet posted"
              else:
                  pending = [s for s in slots if not already_posted(s["series"])]
                  pick = None
                  if pending:
                      next_hour = min(s["hour"] for s in pending)
                      skip, reason = True, f"too early (now {now:%H:%M}, next due {next_hour:02d}:00)"
                  else:
                      skip, reason = True, "today's slot already posted"

          if not force and not skip:
              from post_gate import spacing_block
              wait = spacing_block(now)
              if wait:
                  pick, skip, reason = None, True, wait

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip={'true' if skip else 'false'}\n")
              if pick:
                  f.write(f"series={pick['series']}\n")
                  f.write(f"target_hour={pick['hour']}\n")
                  f.write(f"min_words={pick['min_words']}\n")
                  f.write(f"max_words={pick['max_words']}\n")
                  f.write(f"variant_seed={pick['variant_seed']}\n")

          slot_desc = ", ".join(f"{s['slot']}={s['series']}@{s['hour']:02d}:00" for s in slots)
          print(f"[gate] today's slots: {slot_desc}")
          if skip:
              print(f"[gate] SKIP: {reason}")
          else:
              print(f"[gate] PROCEED slot {pick['slot']} ({pick['series']}): {reason}")
          EOF

      - name: Install system deps (ffmpeg, fonts, espeak fallback)
        if: steps.gate.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng

      - name: Install python deps
        if: steps.gate.outputs.skip == 'false'
        run: |
          pip install torch==2.8.0+cpu torchaudio==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # ---- content pipeline ----
      - name: Generate script (series selected by today's profile)
        if: steps.gate.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          COUNTRY_INDEX: ${{ inputs.country_index }}
        run: |
          SERIES="${{ steps.gate.outputs.series }}"
          MIN_WORDS="${{ steps.gate.outputs.min_words }}"
          MAX_WORDS="${{ steps.gate.outputs.max_words }}"
          VARIANT_SEED="${{ steps.gate.outputs.variant_seed }}"
          COMMON_ARGS="--config config/countries.json --min-words $MIN_WORDS --max-words $MAX_WORDS --variant-seed $VARIANT_SEED"
          if [ -n "$COUNTRY_INDEX" ]; then
            case "$COUNTRY_INDEX" in *[!0-9]*) echo "country_index must be a number"; exit 1;; esac
            COMMON_ARGS="$COMMON_ARGS --index $COUNTRY_INDEX"
          fi
          echo "[generate] series=$SERIES min_words=$MIN_WORDS max_words=$MAX_WORDS"
          if   [ "$SERIES" = "country" ];  then
            python scripts/generate_country_script.py $COMMON_ARGS
          elif [ "$SERIES" = "hook" ];     then
            python scripts/generate_hook_script.py $COMMON_ARGS
          elif [ "$SERIES" = "trending" ]; then
            python scripts/generate_trending_script.py $COMMON_ARGS
          elif [ "$SERIES" = "geography" ]; then
            python scripts/generate_geography_script.py $COMMON_ARGS
          elif [ "$SERIES" = "worlddata" ]; then
            python scripts/generate_worlddata_script.py $COMMON_ARGS
          elif [ "$SERIES" = "worst" ]; then
            # Rankings pipeline over the worst-of metrics; the metric advances once per
            # worst day (every len(SERIES_CYCLE) days). Word targets come from the
            # rankings video config, like the daily rankings series.
            STEP=$(python -c "import sys; sys.path.insert(0, 'scripts'); from daily_variation import SERIES_CYCLE; print(len(SERIES_CYCLE))")
            python scripts/generate_rankings_script.py --config config/countries.json               --video-config config/rankings_video.json               --metrics-config config/rankings_negative_metrics.json               --rotation-step "$STEP" --variant-seed "$VARIANT_SEED"
          else
            echo "[generate] unknown series '$SERIES' — defaulting to country"
            python scripts/generate_country_script.py $COMMON_ARGS
          fi

      - name: Fetch footage (Pexels / Pixabay / animation)
        if: steps.gate.outputs.skip == 'false' && steps.gate.outputs.series != 'geography' && steps.gate.outputs.series != 'worlddata' && steps.gate.outputs.series != 'worst'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FOOTAGE_SOURCE: ${{ inputs.footage_source }}
        run: |
          ARG=""
          if [ -n "$FOOTAGE_SOURCE" ]; then
            ARG="--source $FOOTAGE_SOURCE"
          fi
          python scripts/fetch_footage.py --config config/countries.json $ARG

      - name: Generate TTS voiceover
        if: steps.gate.outputs.skip == 'false'
        env:
          VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
        run: python scripts/generate_tts.py --config config/countries.json

      # Runs AFTER the voiceover on purpose: the map is pre-sliced into one clip
      # per narration beat, and those boundaries have to match what
      # assemble_video.py derives from the REAL voice length. Estimating from
      # word count drifted ~7%, and every segment's shortfall got filled by
      # looping that slice back to its start (visible camera snap-back).
      - name: Render geography map footage
        if: steps.gate.outputs.skip == 'false' && steps.gate.outputs.series == 'geography'
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        # 3D map with the country raised in its flag colours and one continuous dolly;
        # the flat-map renderer is the fallback (same footage.json contract).
        run: |
          python scripts/render_geography_motion.py --config config/countries.json || {
            echo "::warning::3D geography render failed -- using the flat map"
            rm -f build/footage_clip*.mp4
            python scripts/render_geography_map.py --config config/countries.json
          }

      # Same "after TTS" ordering requirement as geography's render step above —
      # segment slice boundaries must match the real voice length.
      - name: Render world data graphics
        if: steps.gate.outputs.skip == 'false' && steps.gate.outputs.series == 'worlddata'
        # waving-flag motion for the "flags" sub-type; the map renderer covers "stats"
        # and any motion failure
        run: |
          python scripts/render_worlddata_motion.py --config config/countries.json \
            || python scripts/render_worlddata_graphics.py --config config/countries.json

      # Worst-of countdown: the rankings motion renderer (3D map flights, countries
      # rising in their flags, count-ups, sfx.wav), with the static renderer as fallback.
      # Same "after TTS" ordering as the other renderers.
      - name: Render worst-of countdown
        if: steps.gate.outputs.skip == 'false' && steps.gate.outputs.series == 'worst'
        run: |
          if python scripts/render_rankings_motion.py --video-config config/rankings_video.json; then
            echo "HOOK_FLAG=--no-hook" >> "$GITHUB_ENV"
          else
            echo "::warning::motion render failed -- using the static renderer"
            rm -f build/sfx.wav build/footage_clip*.mp4
            python scripts/render_rankings_graphics.py --video-config config/rankings_video.json
          fi

      - name: Generate captions
        if: steps.gate.outputs.skip == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_captions.py --config config/countries.json

      - name: Generate background music (ambient pad)
        if: steps.gate.outputs.skip == 'false'
        run: python scripts/generate_music.py

      # Motion intro: camera sweeps across a tilted 3D-style map to the country, which
      # rises out of the map, then a flag + name card lands. Falls back to the old
      # globe zoom if the motion render fails, and to no intro if both do.
      - name: Generate motion intro
        if: steps.gate.outputs.skip == 'false' && steps.gate.outputs.series != 'worst'
        continue-on-error: true
        run: |
          python -c "import json;d=json.load(open('build/script.json'));print(f\"--name={d['name']}\n--lat={d['lat']}\n--lon={d['lon']}\n--iso={d['iso2']}\")" > /tmp/introargs
          NAME=$(sed -n 's/^--name=//p' /tmp/introargs)
          LAT=$(sed -n 's/^--lat=//p' /tmp/introargs)
          LON=$(sed -n 's/^--lon=//p' /tmp/introargs)
          ISO=$(sed -n 's/^--iso=//p' /tmp/introargs)
          python scripts/generate_motion_intro.py --name "$NAME" --lat "$LAT" --lon "$LON" \
            --iso "$ISO" --out build/intro.mp4 --config config/countries.json \
          || python scripts/generate_intro.py --name "$NAME" --lat "$LAT" --lon "$LON" \
            --iso "$ISO" --map assets/map/bluemarble.jpg --out build/intro.mp4 \
            --config config/countries.json

      - name: Scene-cut sound effects
        # the worst-of countdown brings its own sound-effects track
        if: steps.gate.outputs.skip == 'false' && steps.gate.outputs.series != 'worst'
        continue-on-error: true
        run: python scripts/make_transition_sfx.py --config config/countries.json

      - name: Assemble video
        if: steps.gate.outputs.skip == 'false'
        run: |
          if [ "${{ steps.gate.outputs.series }}" = "worst" ]; then
            python scripts/assemble_video.py --config config/rankings_video.json --sfx build/sfx.wav $HOOK_FLAG
          else
            python scripts/assemble_video.py --config config/countries.json --intro build/intro.mp4 --sfx build/sfx.wav
          fi

      # ---- publish ----
      - name: Publish video as release asset
        id: publish_asset
        if: steps.gate.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SERIES="${{ steps.gate.outputs.series }}"
          TAG="rotating-${SERIES}-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" build/final.mp4 \
            --title "$TAG" --notes "Automated rotating short (1/day, series=$SERIES)" --latest=false
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/final.mp4"
          echo "video_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Public video URL: $URL"

      - name: Post to Facebook + TikTok (Buffer)
        id: post_buffer
        if: steps.gate.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        continue-on-error: true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_ID }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
        run: |
          python scripts/post_buffer.py \
            --video-url "${{ steps.publish_asset.outputs.video_url }}" \
            --script build/script.json \
            --caption-facebook build/caption_meta.txt \
            --caption-tiktok build/caption_tiktok.txt \
            --title-file build/yt_title.txt

      - name: Post to YouTube (Direct API)
        id: post_youtube
        if: steps.gate.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/post_youtube.py \
            --video build/final.mp4 \
            --title-file build/yt_title.txt \
            --desc-file build/caption_youtube.txt \
            --config config/countries.json

      # ---- dry run only: grab the assembled video + voice files for inspection ----
      - name: Upload dry-run artifacts
        if: always() && steps.gate.outputs.skip == 'false' && github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-rotating-output
          path: |
            build/final.mp4
            build/voice.wav
            build/intro_voice.wav
            build/intro.mp4
            build/sfx.wav
            build/captions.srt
            build/script.json
          if-no-files-found: warn
          retention-days: 3

      # ---- log results ----
      - name: Append run to history log
        if: always() && steps.gate.outputs.skip == 'false' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SERIES="${{ steps.gate.outputs.series }}"
          SCRIPT_TITLE=$(python -c "import json;d=json.load(open('build/script.json'));print(d.get('name',d.get('title','unknown')))" 2>/dev/null || echo "unknown")
          IDENT=$(python -c "import json;print(json.load(open('build/footage.json'))['identifier'])" 2>/dev/null || echo "unknown")
          echo "${DATE},${SERIES},\"${SCRIPT_TITLE}\",${IDENT},${{ steps.post_buffer.outcome }},${{ steps.post_youtube.outcome }}" >> logs/history_rotating.csv
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/history_rotating.csv
          git commit -m "log: rotating run ${DATE} (${SERIES})" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase && git push && break || sleep $((i * 5))
          done

      - name: Fail the run if any platform post failed
        if: always() && steps.gate.outputs.skip == 'false' && (steps.post_buffer.outcome == 'failure' || steps.post_youtube.outcome == 'failure')
        run: |
          echo "::error::Posting failed -- Facebook/TikTok (Buffer): ${{ steps.post_buffer.outcome }}, YouTube: ${{ steps.post_youtube.outcome }}"
          exit 1
