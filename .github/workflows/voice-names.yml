name: voice-names

# Temporary: reads every country and India place name aloud in the narration voice (default
# style, no RVC) so the names it mispronounces can be found by transcribing the audio and
# given a respelling in generate_tts.PRONUNCIATION_FIXUPS. Posts nothing. Delete when done.
on:
  workflow_dispatch:
    inputs:
      extra:
        description: "Extra words or respellings to test (comma separated)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Install the voice engine
        uses: oceanfarm1992-design/styletts2-voice-clone@7fde0e580c60475dbb55e5e7003f743892c3ce17
        with:
          engines: styletts2
          python-version: "3.11"
      - name: Read the names aloud
        env:
          VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
          EXTRA: ${{ inputs.extra }}
        run: |
          mkdir -p out
          python - <<'EOF'
          import json, os
          from voiceclone import synthesize
          names = [c["name"] for c in json.load(open("config/countries.json", encoding="utf-8"))["countries"]]
          for p in json.load(open("config/india_places.json", encoding="utf-8"))["places"]:
              names += [p["name"], p["region"]]
          names += [n.strip() for n in os.environ.get("EXTRA", "").split(",") if n.strip()]
          names = list(dict.fromkeys(names))
          chunks = [names[i:i + 5] for i in range(0, len(names), 5)]
          json.dump(chunks, open("out/chunks.json", "w"))
          for i, chunk in enumerate(chunks):
              text = "Next: " + ", ".join(chunk[:-1]) + (", and " if len(chunk) > 1 else "") + chunk[-1] + "."
              synthesize(text, f"out/chunk_{i:03d}.wav", engine="styletts2", language="en", style="default",
                         voice_ref_repo="oceanfarm1992-design/voice-reference-audio", rvc="off")
              print("[names]", i, chunk)
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: voice-names
          path: out/
          retention-days: 3
