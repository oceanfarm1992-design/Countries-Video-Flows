name: voice-names

# Temporary: reads every country and India place name aloud in the narration voice (default
# style, no RVC) so the names it mispronounces can be found by transcribing the audio and
# given a respelling in generate_tts.PRONUNCIATION_FIXUPS. Posts nothing. Delete when done.
on:
  workflow_dispatch:
    inputs:
      extra:
        description: "Extra words or respellings to test (comma separated)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Install the voice engine
        uses: oceanfarm1992-design/styletts2-voice-clone@7fde0e580c60475dbb55e5e7003f743892c3ce17
        with:
          engines: styletts2
          python-version: "3.11"
      - name: Read each name and its respellings aloud
        env:
          VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
        run: |
          mkdir -p out
          python - <<'EOF'
          import json
          from voiceclone import synthesize
          cands = json.load(open("scripts/pron_candidates.json", encoding="utf-8"))
          manifest = []
          for name, spellings in cands.items():
              for j, spelling in enumerate(dict.fromkeys([name, *spellings])):
                  path = f"out/n{len(manifest):03d}.wav"
                  synthesize(f"The place is {spelling}.", path, engine="styletts2", language="en", style="default",
                             voice_ref_repo="oceanfarm1992-design/voice-reference-audio", rvc="off")
                  manifest.append({"name": name, "spelling": spelling, "file": path.split("/")[1]})
                  print("[pron]", manifest[-1])
          json.dump(manifest, open("out/manifest.json", "w", encoding="utf-8"), ensure_ascii=False)
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: voice-names
          path: out/
          retention-days: 3
