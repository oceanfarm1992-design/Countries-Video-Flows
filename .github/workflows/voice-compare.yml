name: voice-compare

# Temporary: renders the same English lines in several speaking styles (RVC on) so the styles
# can be compared by ear. Posts nothing. Delete once the choice is made.
on:
  workflow_dispatch:
    inputs:
      styles:
        description: "Space-separated style:pitch combos (pitch = RVC semitones, negative = deeper; off = no RVC, raw StyleTTS2)"
        type: string
        default: "default:0 default:-3 default:off"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Install the voice engine (own voice + RVC)
        uses: oceanfarm1992-design/styletts2-voice-clone@7fde0e580c60475dbb55e5e7003f743892c3ce17
        with:
          engines: styletts2 rvc
          python-version: "3.11"
      # Works on a LOCAL copy of the private voice repo (VOICE_REF_DIR), so the live channel's
      # profile.json is never touched. Each "style:pitch" combo patches the copy's RVC pitch
      # (semitones, negative = deeper) and renders in its own process.
      - name: Render the clips
        env:
          VOICE_REPO_PAT: ${{ secrets.VOICE_REPO_PAT }}
          COMBOS: ${{ inputs.styles }}
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${VOICE_REPO_PAT}@github.com/oceanfarm1992-design/voice-reference-audio.git" "$RUNNER_TEMP/voiceref"
          mkdir -p out
          for combo in $COMBOS; do
            export STYLE="${combo%%:*}"
            export PITCH="${combo##*:}"
            [ "$STYLE" = "$PITCH" ] && PITCH=0
            export VOICE_REF_DIR="$RUNNER_TEMP/voiceref"
            python - <<'EOF'
          import json, os, sys
          sys.path.insert(0, "scripts")
          prof_path = os.path.join(os.environ["VOICE_REF_DIR"], "profile.json")
          prof = json.load(open(prof_path, encoding="utf-8"))
          rvc_on = os.environ["PITCH"] != "off"
          prof["rvc"]["pitch"] = int(os.environ["PITCH"]) if rvc_on else 0
          json.dump(prof, open(prof_path, "w", encoding="utf-8"))
          from spoken_text import to_spoken
          from voiceclone import synthesize
          text = to_spoken(
              "This is not Switzerland. This is India. Welcome to Khajjiar, in Himachal Pradesh. "
              "It sits about 2,000 metres above sea level, and a Swiss ambassador once called it the "
              "Mini Switzerland of India. Imagine standing right here. Follow for the India you never knew.")
          style, pitch = os.environ["STYLE"], os.environ["PITCH"]
          out = f"out/{style}_pitch{pitch}.wav"
          used = synthesize(text, out, engine="styletts2", language="en", style=style, rvc="on" if rvc_on else "off")
          print(f"[compare] {style} pitch {pitch}: {used}")
          EOF
          done
      - uses: actions/upload-artifact@v7
        with:
          name: voice-compare
          path: out/*.wav
          retention-days: 3

  # Stock Kokoro English voices (not your clone), only to hear what the model's own defaults sound like.
  kokoro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
          pip install torch==2.8.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro==0.9.4 soundfile numpy
      - name: Render stock voices
        run: |
          mkdir -p out_kokoro
          python - <<'EOF'
          import numpy as np, soundfile as sf
          from kokoro import KPipeline
          text = ("This is not Switzerland. This is India. Welcome to Khajjiar, in Himachal Pradesh. "
                  "It sits about two thousand metres above sea level, and a Swiss ambassador once called it the "
                  "Mini Switzerland of India. Imagine standing right here. Follow for the India you never knew.")
          for voice, lang in [("am_onyx", "a"), ("am_adam", "a"), ("am_fenrir", "a"), ("am_michael", "a"), ("bm_george", "b"), ("bm_lewis", "b")]:
              pipe = KPipeline(lang_code=lang)
              audio = np.concatenate([a for _, _, a in pipe(text, voice=voice)])
              sf.write(f"out_kokoro/{voice}.wav", audio, 24000)
              print("[kokoro]", voice)
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: voice-compare-kokoro
          path: out_kokoro/*.wav
          retention-days: 3
