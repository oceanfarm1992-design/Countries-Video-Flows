version: 2
updates:
  # Keep Python dependencies (requirements.txt) current
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    # Upgrades that break every install -- each was merged once and stopped all posting:
    #   soundfile >= 0.13: styletts2 (the cloned voice) pins soundfile < 0.13
    #   numpy 2.x: no build for the workflows' Python 3.11 at 2.5, and torch/styletts2
    #              are pinned against 1.26
    ignore:
      - dependency-name: soundfile
        versions: [">=0.13"]
      - dependency-name: numpy
        versions: [">=2"]

  # Keep GitHub Actions versions current (fixes the Node.js 20 deprecation warnings)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(actions)"
